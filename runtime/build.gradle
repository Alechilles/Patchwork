plugins {
    id 'java-library'
}

def localProperties = new Properties()
rootProject.file('Patchwork/gradle.properties').withInputStream { localProperties.load(it) }
def localProperty = { String name -> providers.gradleProperty(name).getOrElse(localProperties.getProperty(name)) }

group = 'com.alechilles'
version = localProperty('mod_version')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files(localProperty('hytale_server_jar_path'))
    api "com.google.code.gson:gson:${localProperty('gson_version')}"
    implementation 'com.google.jimfs:jimfs:1.3.1'
    implementation 'com.networknt:json-schema-validator:1.5.6'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

configurations.named('testImplementation') {
    extendsFrom(configurations.compileOnly)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir projectDir
}
