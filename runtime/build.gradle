plugins {
    id 'java-library'
}

def localProperties = new Properties()
new File(project.projectDir.parentFile, 'gradle.properties').withInputStream { localProperties.load(it) }
def localProperty = { String name -> providers.gradleProperty(name).getOrElse(localProperties.getProperty(name)) }

group = 'com.alechilles'
version = localProperty('mod_version')
def runtimeProjectVersion = version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://beacon.modstats.io/maven/releases') }
}

dependencies {
    compileOnly files(localProperty('hytale_server_jar_path'))
    api "com.alechilles:beacon-runtime:${localProperty('beacon_version')}"
    api "com.google.code.gson:gson:${localProperty('gson_version')}"
    testImplementation 'com.google.jimfs:jimfs:1.3.1'
    testImplementation 'com.networknt:json-schema-validator:1.5.6'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

configurations.named('testImplementation') {
    extendsFrom(configurations.compileOnly)
}

tasks.named('processResources') {
    from(project.parent.projectDir) {
        include 'LICENSE.txt', 'NOTICE.txt'
        into 'META-INF/patchwork'
    }
    inputs.property('projectVersion', runtimeProjectVersion)
    filesMatching('META-INF/beacon/projects/patchwork.json') {
        expand(projectVersion: runtimeProjectVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir projectDir
}
